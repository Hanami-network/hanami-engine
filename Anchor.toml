[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
hanami = "4YZuozjXWMmZTd1a35NyKQVYi9BoJJMr1L2aasTT9GQf"

[programs.devnet]
hanami = "4YZuozjXWMmZTd1a35NyKQVYi9BoJJMr1L2aasTT9GQf"

[programs.mainnet]
hanami = "4YZuozjXWMmZTd1a35NyKQVYi9BoJJMr1L2aasTT9GQf"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000
shutdown_wait = 2000

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
